# nginx -s reload

map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
}

server {
    listen       80;
    server_name  dev.dreamcat.org;

    # location /health {
    location / {
        add_header Content-Type "text/plain;charset=utf-8";
        return 200 "Your IP Address:$remote_addr";
    }
}

# qbittorrent-nox --webui-port=1111 -d
server {
    listen       80;
    server_name  qbit.dev.dreamcat.org;

    location / {
        proxy_pass http://${LOCAL_IP}:1111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        add_header Content-Type "text/plain;charset=utf-8";
        return 200 "Your IP Address:$remote_addr";
    }
}

server {
    listen       80;
    server_name  kafka.dev.dreamcat.org;

    location / {
        proxy_pass http://${LOCAL_IP}:9093;
    }
}

server {
    listen       80;
    server_name  flink.dev.dreamcat.org;

    location / {
        proxy_pass http://${LOCAL_IP}:8081;
    }
}

server {
    listen       80;
    server_name  minio.dev.dreamcat.org;

    location / {
        proxy_pass http://${LOCAL_IP}:9090;

        proxy_set_header  Host $http_host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    location ^~ /ws {
        proxy_pass http://${LOCAL_IP}:9090;

        proxy_set_header  Host $http_host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

